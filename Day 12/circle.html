<html>
<head>
<title>AREA AND CIRCUMFERENCE</title>
<script>
let r=parseInt(prompt("Enter the radius of a circle: "));
let area=3.14*r*r;
let circumference=2*3.14*r; 
document.write("Area of the cicle is ",+area+"<br>");
document.write("Circumference of the cicle is ",+circumference+"<br>");
</script>
</head>

</body>
