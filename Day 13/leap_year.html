<html>
<head>
<title>Leap Year</title>
<script language="JavaScript">
let y=parseInt(prompt("Enter the year: "));
if(y%100!=0)
if(y%4==0)
document.write("leap year");
else
document.write("Not a leap year");
else
if(y%400==0)
document.write("Leap Year");
else
document.write("Not a Leap year");
</script>
</head>
<body bgcolor="black" text="white">
</body>
</html>
