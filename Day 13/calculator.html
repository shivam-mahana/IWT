<html>
<head>
<title>calculator</title>
<script language="JavaScript">
let a,b,c;
a=parseInt(prompt("Enter the first number: "));
b=parseInt(prompt("Enter the second number: "));
let ch=prompt("Enter ur choice: ");
switch(ch)
{
case'+':
c=a+b;
break;
case '-':
c=a-b;
break;
case '*':
c=a*b;
break;
case '/':
c=a/b;
break;
case '%':
c=a%b;
break;
default:
document.write("wrong choice");
} 
document.write("Calculated value="+c);
</script>
</head>
<body bgcolor="black" text="white">
</body>
</html>
