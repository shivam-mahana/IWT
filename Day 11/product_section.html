<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Featured Products</title>
  <style>
    .product-section {
      padding: 20px;
      background-color: #f9f9f9;
    }

    .product-section h2 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 2rem;
      color: #333;
    }

    .product-container {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap; /* ensures responsiveness */
    }

    .product-card {
      flex: 1;
      min-width: 200px;
      max-width: 250px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .product-card img {
      width: 100%;
      height: auto;
      border-radius: 5px;
      margin-bottom: 10px;
    }

    .product-card h3 {
      font-size: 1.2rem;
      margin: 10px 0;
      color: #444;
    }

    .product-card p {
      font-size: 1rem;
      color: #666;
      margin-bottom: 15px;
      size: 50px;
    }

    .product-card button {
      background-color: #007bff;
      color: #fff;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .product-card button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="product-section">
    <h2>Featured Products</h2>
    <div class="product-container">
      <div class="product-card">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSkWVLkwhpo1BN4sI8xjfIkFrmUZ1inDNebdQ&s" alt="Product 1">
        <h3>Lining Turbo 1000</h3>
        <p>$19.99</p>
        <button>Add to Cart</button>
      </div>
      <div class="product-card">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRavu0SE7FcRrLFyIMBIwmgejrZO64hBWjqgw&s" alt="Product 2">
        <h3>Yonex Arcsaber 11 Pro</h3>
        <p>$29.99</p>
        <button>Add to Cart</button>
      </div>
      <div class="product-card">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQEoSHNDLFWAaK52eUX2w061s4Il6xIaFT3cA&s" alt="Product 3">
        <h3>Yonex Atrox 100ZZ</h3>
        <p>$39.99</p>
        <button>Add to Cart</button>
      </div>
      <div class="product-card">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS8zEnauBeXG1pMsq-guQUtePMHwXsU2hTtyg&s" alt="Product 4">
        <h3>Yonex Nanoflare 1000ZZ</h3>
        <p>$49.99</p>
        <button>Add to Cart</button>
      </div>
    </div>
  </div>
</body>
</html>
